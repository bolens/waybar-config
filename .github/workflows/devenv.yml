name: Development environment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: devenv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.paths.outputs.environment }}
      devcontainer: ${{ steps.paths.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        with:
          filters: |
            environment:
              - 'devenv.*'
              - '.github/workflows/devenv.yml'
              - '*.sh'
              - 'Makefile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.markdownlint-cli2.jsonc'
              - '.gitleaks.toml'
              - 'stylelint.config.mjs'
              - '**/*.css'
              - 'data/**'
              - 'includes/**'
              - 'layouts/**'
              - 'modules/**'
              - 'systemd/**'
              - 'ruff.toml'
              - '.github/source-lint.json'
              - '*.md'
              - '.markdownlint.json'
              - '.githooks/**'
              - '.github/workflows/**'
              - '.agents/**'
              - '.specify/**'
              - 'docs/**'
              - 'specs/003-development-environments/**'
              - 'scripts/**'
              - 'tests/**'

            devcontainer:
              - '.devcontainer/**'
              - '.github/workflows/devenv.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'

  validate:
    name: devenv (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.environment == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install pinned devenv
        run: nix profile add --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - name: Validate native development environment
        if: runner.os != 'Linux' || vars.WOODPECKER_LINUX_CI != 'true'
        run: devenv test

  container:
    name: Docker development environment
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.environment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install pinned devenv
        run: nix profile add --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - name: Validate Docker development image
        run: |
          python3 scripts/development-container.py build docker
          python3 scripts/development-container.py run docker -- bash scripts/check-development.sh

  devcontainer:
    name: devcontainer (Docker)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build VS Code development image
        run: docker build --tag waybar-config-devcontainer-ci --file .devcontainer/Dockerfile .devcontainer
      - name: Verify mounted checkout and post-create setup
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            waybar-config-devcontainer-ci bash .devcontainer/post-create.sh

  result:
    name: Development environment
    if: always()
    needs: [changes, validate, container, devcontainer]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected environment checks
        env:
          CHANGES: ${{ needs.changes.result }}
          VALIDATE: ${{ needs.validate.result }}
          DEVCONTAINER: ${{ needs.devcontainer.result }}
          DEVCONTAINER_SELECTED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.devcontainer == 'true' }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          test "$CHANGES" = success
          case "$VALIDATE" in success|skipped) ;; *) exit 1 ;; esac
          case "$CONTAINER" in success|skipped) ;; *) exit 1 ;; esac
          if test "$DEVCONTAINER_SELECTED" = true; then
            test "$DEVCONTAINER" = success
          else
            case "$DEVCONTAINER" in success|skipped) ;; *) exit 1 ;; esac
          fi
