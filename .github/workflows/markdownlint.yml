name: "CI: Markdownlint"

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint-cli2.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/markdownlint.yml"
      - "scripts/ci/check-markdownlint.sh"
      - "scripts/ci/check-docs-index.sh"
      - "scripts/ci/ensure-pnpm.sh"
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint-cli2.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/markdownlint.yml"
      - "scripts/ci/check-markdownlint.sh"
      - "scripts/ci/check-docs-index.sh"
      - "scripts/ci/ensure-pnpm.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enable Corepack
        run: corepack enable
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Docs index sync
        run: bash scripts/ci/check-docs-index.sh
      - name: Lint Markdown
        run: bash scripts/ci/check-markdownlint.sh
