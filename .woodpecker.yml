# Portable validation on Gitea-connected Woodpecker runners. No publication credentials.
when:
  - event:
      - push
      - pull_request
      - manual
steps:
  - name: verify
    image: node:26-bookworm@sha256:fa52d1669505e29b58c042875b1d65c229e0787a3610fd52869b22b68e480853
    environment:
      CI: 'true'
    commands:
      - |-
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends make git python3 jq dash
      - make check-fast check-generator check-secrets check-drift
