# Complete Linux validation; GitHub Actions remain during protected-check cutover.
# The disposable container owns its Nix store; no host daemon/socket is mounted.
labels:
  platform: linux/amd64
  backend: docker
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.10.0@sha256:0f06b03ec33137b556c77538563f66c400339052d0c5199d4c3ad1a2a37e1964
    settings:
      depth: 0
      partial: false
when:
  - event: push
    branch: main
  - event: [pull_request, manual]
  - event: cron
    branch: main
steps:
  - name: verify
    image: docker.io/nixos/nix:2.35.4@sha256:f159a58f390677f41e8e900a74b6e2f9c7f27b364122ae6acf7a652ce6c551c0
    environment:
      CI: 'true'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NIX_CONFIG: |-
        experimental-features = nix-command flakes
        sandbox = false
        build-users-group = nixbld
        max-jobs = 1
        cores = 2
        extra-substituters = https://devenv.cachix.org
        extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
    commands:
      - nix run --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222 -- shell -- bash -c 'test "$(git rev-parse --is-shallow-repository)" = false'
      - nix run --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222 -- shell -- python3 scripts/prepare-ci-container.py
      - nix run --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222 -- test
      - nix run --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222 -- shell -- bash scripts/check-spec-kit.sh
