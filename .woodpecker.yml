# Portable validation on Gitea-connected Woodpecker runners. No publication credentials.
when:
  - event:
      - push
      - pull_request
      - manual
steps:
  - name: verify
    image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    environment:
      CI: 'true'
    commands:
      - |-
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends make git python3 jq dash ca-certificates
      - make check-fast check-generator check-secrets check-drift
